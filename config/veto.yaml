diagnostic_level: summary
# Production signal-only veto stack for manual Delta execution.
# Only venue-agnostic guards remain active: G1, G2, G4, G5, G6, G8 and G9.

g1_data_integrity:
  enabled: true
  severity: CRITICAL

g2_feed_health:
  enabled: true
  feed_gap_threshold_ms: 10000
  max_reconnects_per_window: 5
  reconnect_window_min: 5
  severity: CRITICAL

g4_spread_explosion:
  enabled: true
  max_spread_bps:
    majors: 5
    mid_caps: 12
    small_caps: 25
  bookticker_stale_ms: 1000
  severity: HIGH

g5_oi_anomaly:
  enabled: true
  oi_anomaly_pct: 0.08
  oi_stale_ms: 90000
  recovery_consecutive_samples: 2
  severity: CRITICAL

g6_funding_extreme:
  enabled: true
  hard_funding_z_threshold: 3.5
  severity: MEDIUM
  action: DEGRADE
  degrade_max_grade: "B"

g8_volatility_flash:
  enabled: true
  bar_range_atr_mult: 4.0
  atr_percentile_extreme: 0.97
  severity: HIGH
  action: DEGRADE
  degrade_max_grade: "A"

g9_btc_regime:
  enabled: true
  severity: MEDIUM
  action: DEGRADE
  degrade_max_grade: "B"
