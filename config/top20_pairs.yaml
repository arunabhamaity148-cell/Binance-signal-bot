# top20_pairs.yaml
# Exact 20-pair universe per spec section 4. min_qty/qty_step/price_tick
# below are conservative placeholders; the boot sequence cross-checks
# these against a live /fapi/v1/exchangeInfo call and logs a
# config-drift warning (not a boot failure) on mismatch, since exchange
# filters can change independently of this file.

pairs:
  - symbol: BTCUSDT
    enabled: true
    fee_maker_bps: 2.0     # class: A, source: Binance USDⓈ-M fee schedule (standard tier)
    fee_taker_bps: 5.0     # class: A, source: Binance USDⓈ-M fee schedule (standard tier)
    min_qty: 0.001         # class: A, source: exchangeInfo LOT_SIZE filter (verify live)
    qty_step: 0.001        # class: A, source: exchangeInfo LOT_SIZE filter (verify live)
    price_tick: 0.10       # class: A, source: exchangeInfo PRICE_FILTER (verify live)

  - symbol: ETHUSDT
