diagnostic_level: summary                # off | summary | verbose
# news_sources.yaml
# Free-cost only ($0/month hard requirement, spec section 14). All
# Public endpoints are kept in configuration so operators can replace a
# feed without changing code. These are current endpoint candidates
# selected on 2026-10-09; the VPS must still verify each one for DNS,
# firewall, proxy, IPv4/IPv6, HTTP status, and feed format differences.

tier_1:
  - name: federal_reserve_press
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    format: rss
    timeout_s: 10                       # class: E
    credibility_weight: 1.0             # class: E
  - name: sec_press
    url: "https://www.sec.gov/news/pressreleases.rss"
    format: rss
    timeout_s: 10
    credibility_weight: 1.0
  - name: cftc_press
    url: "https://www.cftc.gov/PressRoom/PressReleases/rss.xml"
    format: rss
    timeout_s: 10
    credibility_weight: 1.0
  - name: us_treasury_press
    url: "https://home.treasury.gov/rss/press-releases.xml"
    format: rss
    timeout_s: 10
    credibility_weight: 1.0
  - name: binance_announcements
    url: "https://www.binance.com/en/support/announcement/rss"
    format: rss
    timeout_s: 10
    credibility_weight: 1.0
  - name: blockchain_foundation_announcements
    url: "https://news.google.com/rss/search?q=blockchain+foundation+crypto&hl=en-US&gl=US&ceid=US:en"
    format: rss
    timeout_s: 10
    credibility_weight: 0.9             # class: F, slightly below gov/exchange tier

tier_2:
  - name: coindesk
    url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    format: rss
    timeout_s: 10
    credibility_weight: 0.75            # class: F
  - name: the_block
    url: "https://www.theblock.co/rss.xml"
    format: rss
    timeout_s: 10
    credibility_weight: 0.75
  - name: cointelegraph
    url: "https://cointelegraph.com/rss"
    format: rss
    timeout_s: 10
    credibility_weight: 0.65            # class: F, lower due to higher noise
  - name: decrypt
    url: "https://decrypt.co/feed"
    format: rss
    timeout_s: 10
    credibility_weight: 0.70
  - name: blockworks
    url: "https://blockworks.co/feed"
    format: rss
    timeout_s: 10
    credibility_weight: 0.70
  - name: reuters_public
    url: "https://feeds.reuters.com/reuters/businessNews"
    format: rss
    timeout_s: 10
    credibility_weight: 0.80

tier_3:
  - name: gdelt
    url: "https://api.gdeltproject.org/api/v2/doc/doc?query=cryptocurrency&mode=artlist&format=json&maxrecords=75&timespan=24h"
    format: json
    timeout_s: 10
    credibility_weight: 0.30            # class: F
  - name: google_news_crypto
    url: "https://news.google.com/rss/search?q=cryptocurrency&hl=en-US&gl=US&ceid=US:en"
    format: rss
    timeout_s: 10
    credibility_weight: 0.25
  - name: cryptopanic_public
    url: "https://cryptopanic.com/news/rss/"
    format: rss
    timeout_s: 10
    credibility_weight: 0.25

category_half_life_hours:               # class: F throughout
  regulatory: 6
  macro: 12
  hack: 2
  listing: 4
  delisting: 4
  etf: 8
  liquidation: 1
  outage: 1
  other: 3

corroboration:
  global_block_requires:
    tier1_single_source: true
    tier2_min_independent_sources: 2
  tier3_max_severity: MEDIUM            # hard ceiling, never HIGH/CRITICAL

retry:
  max_attempts: 4                       # class: E
  base_backoff_ms: 500                  # class: E
  jitter_ms: 250                        # class: E
  respect_retry_after_header: true
