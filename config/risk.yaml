# risk.yaml

risk_per_trade_pct: 0.5                 # class: E, conservative default
min_rr_tp2: 1.8                         # class: F
tp_r_multiples_default: [1.0, 2.0, 3.0, 5.0]   # class: B, overridden per-strategy where noted
partial_exit_fractions: [0.40, 0.30, 0.20, 0.10]   # class: E, per spec section 21

max_concurrent: 5                       # class: E
max_daily_signals: 12                   # class: E
max_daily_loss_r: 6.0                   # class: E
cooldown_min: 30                        # class: E, per symbol after a closed/invalidated signal

expiry_per_grade:
  "A+": 60                              # minutes, class: F
  "A": 45                               # class: F
  "B": 30                               # class: F

correlated_clusters:                    # class: C, for exposure capping
  - name: majors_beta
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  # additional clusters may be added; any symbol not listed is treated
  # as its own single-symbol cluster

symbol_tiers:                           # shared reference for veto.yaml
  majors: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT]
  mid_caps: [XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT, LINKUSDT, BCHUSDT, LTCUSDT, DOTUSDT, TRXUSDT]
  small_caps: [SUIUSDT, APTUSDT, ARBUSDT, OPUSDT, TONUSDT, NEARUSDT, ATOMUSDT]

# NOTE: no reference_equity_usdt key here - equity comes exclusively
# from the ASSUMED_ACCOUNT_EQUITY_USD environment variable per spec
# section 18/section 20.
